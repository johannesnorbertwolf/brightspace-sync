name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install -r requirements-build.txt
      - name: Build the app
        run: ./scripts/build_app.sh
      - name: Package the app
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent "Brightspace Sync.app" "Brightspace-Sync.zip"
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Brightspace-Sync.zip
          generate_release_notes: true
